name: Monthly snapshot

on:
  schedule:
    # 09:00 UTC on the 1st of every month, after the nightly ATS ingestion
    - cron: '0 9 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Compute version
        id: v
        run: echo "version=$(date -u +%Y.%m)" >> "$GITHUB_OUTPUT"

      - name: Skip if this month is already released
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download CSVs from the live feed
        if: steps.exists.outputs.exists == 'false'
        run: |
          set -e
          for d in market-overview certifications technologies companies locations jobs; do
            curl -sfL -A "Mozilla/5.0 (cloudjobs-datasets snapshot)" \
              "https://cloudjobs.io/datasets/files/$d.csv" -o "data/cloudjobs-$d.csv"
            test "$(wc -l < "data/cloudjobs-$d.csv")" -gt 1
          done

      - name: Commit snapshot
        if: steps.exists.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Snapshot ${{ steps.v.outputs.version }}"
          git push

      - name: Create immutable release
        if: steps.exists.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.v.outputs.version }}"
          gh release create "v$V" data/*.csv \
            --title "CloudJobs datasets $V" \
            --notes "Immutable snapshot of the CloudJobs open datasets for $V, taken $(date -u +%Y-%m-%d). Values never change after release. Live data: https://cloudjobs.io/datasets. License: CC BY 4.0 - cite as: CloudJobs ($(date -u +%Y)). Cloud Job Market Datasets, version $V. https://cloudjobs.io/datasets"

      - name: Publish new Kaggle version
        if: steps.exists.outputs.exists == 'false' && env.KAGGLE_API_TOKEN != ''
        run: |
          pip install --quiet kaggle
          cp data/*.csv kaggle/
          kaggle datasets version -p kaggle -m "Snapshot ${{ steps.v.outputs.version }}" --dir-mode skip
