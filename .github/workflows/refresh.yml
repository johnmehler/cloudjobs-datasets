name: Refresh datasets

on:
  schedule:
    # After CloudJobs' daily ATS ingestion (~3am EST / 7-8am UTC)
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download latest CSVs
        run: |
          set -e
          for d in market-overview certifications technologies companies locations jobs; do
            curl -sfL "https://cloudjobs.io/datasets/files/$d.csv" -o "data/cloudjobs-$d.csv"
          done

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "Refresh datasets $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No changes"
          fi
